name: Remind no-squash on release->development

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  remind-no-squash:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR and post reminder
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;

            const isRelease = pr.head.ref.startsWith('release/');
            const isToDevelopment = pr.base.ref === 'development';
            if (!isRelease || !isToDevelopment) return;

            const reminderTag = '[no-squash-reminder]';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100
            });

            if (comments.some(c => c.body?.includes(reminderTag))) return;

            const body = `${reminderTag}
            Hi @${pr.user.login} 👋  
            This PR merges a release branch into development. Please **do not squash**—use a **merge commit** to preserve the release history.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body
            });
