name: Remind no-squash on release->development

on:
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write
  contents: read

jobs:
  remind-no-squash:
    if: >
      github.event.pull_request.base.ref == 'development' &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Check PR and post reminder
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;

            const reminderTag = '[no-squash-reminder]';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100
            });

            if (comments.some(c => c.body?.includes(reminderTag))) return;

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const latestByUser = new Map();
            for (const review of reviews) {
              const login = review.user?.login;
              if (!login) continue;
              const existing = latestByUser.get(login);
              if (!existing || new Date(review.submitted_at) > new Date(existing.submitted_at)) {
                latestByUser.set(login, review);
              }
            }

            const approvalsCount = Array.from(latestByUser.values()).filter(review => review.state === 'APPROVED').length;
            if (approvalsCount < 2) return;

            const body = `${reminderTag}
            Hi @${pr.user.login} 👋  
            This PR merges a release branch into development. Please **do not squash**—use a **merge commit** to preserve the release history.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body
            });
